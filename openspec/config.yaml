schema: spec-driven

context: |
  Tech stack: Next.js 15, TypeScript 5, Tailwind CSS 3.4, Zustand, React Hook Form, Supabase
  Arquitectura: App Router, componentes modulares, estado global con Zustand, formularios con React Hook Form + Zod
  Testing: Vitest, Testing Library, Playwright
  Style: next lint, prettier, tsc --noEmit

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  runner:
    command: "vitest run"
    framework: "Vitest"
  layers:
    unit:
      available: true
      tool: "Vitest"
    integration:
      available: true
      tool: "@testing-library/react"
    e2e:
      available: true
      tool: "Playwright"
  coverage:
    available: true
    command: "vitest run --coverage"
  quality:
    linter:
      available: true
      command: "next lint"
    type_checker:
      available: true
      command: "tsc --noEmit"
    formatter:
      available: true
      command: "prettier --write ."
